<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — PARAH INTEGRATED FARM'S</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
      display: flex; flex-direction: column;
    }
    .auth-wrap {
      flex: 1; display: flex; align-items: center;
      justify-content: center; padding: 40px 16px;
    }
    .auth-card {
      background: var(--white); border-radius: 20px;
      padding: 44px 40px; width: 100%; max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .icon { font-size: 2.8rem; }
    .auth-logo h2 { font-size: 1.5rem; color: var(--green-dark); margin: 8px 0 4px; }
    .auth-logo p  { font-size: 0.83rem; color: var(--text-light); }

    .google-btn {
      width: 100%; padding: 12px 16px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      border: 2px solid var(--border); border-radius: var(--radius-sm);
      background: var(--white); font-size: 0.92rem; font-weight: 600;
      color: var(--text-dark); cursor: pointer; transition: all 0.2s;
      font-family: 'Inter', sans-serif; margin-bottom: 4px;
    }
    .google-btn:hover { background: var(--off-white); border-color: #bbb; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--text-light); font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .pw-wrap { position: relative; }
    .pw-wrap input { width: 100%; padding-right: 44px; }
    .pw-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 1rem;
      color: var(--text-light); padding: 0;
    }

    .forgot { text-align: right; margin-top: -8px; margin-bottom: 18px; }
    .forgot a { font-size: 0.79rem; color: var(--green-mid); font-weight: 500; }

    .submit-btn { width: 100%; padding: 13px; font-size: 0.96rem; margin-top: 6px; }

    .auth-switch {
      text-align: center; margin-top: 22px;
      font-size: 0.84rem; color: var(--text-mid);
    }
    .auth-switch a { color: var(--green-mid); font-weight: 600; }

    .err-box {
      background: #fce4ec; color: #c62828; border-radius: 8px;
      padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px; display: none;
    }
    .ok-box {
      background: var(--green-pale); color: var(--green-mid); border-radius: 8px;
      padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <span class="leaf">🌿</span>
    <div>
      <span>PARAH INTEGRATED FARM'S</span>
      <small>Quality From Our Yard To Your Table</small>
    </div>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="order.html">Order</a></li>
    <li><a href="jobs.html">Jobs</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="signup.html" class="nav-cta">Sign Up</a></li>
  </ul>
  <div class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="icon">🌿</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your PARAH FARM account</p>
    </div>

    <div class="err-box" id="errBox"></div>
    <div class="ok-box"  id="okBox"></div>

    <!-- Google -->
    <button class="google-btn" onclick="googleLogin()">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13 17.8 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/>
        <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.7 10.7l7.8-6z"/>
        <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.3-7.7 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or sign in with email</div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="your@email.com"/>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Enter your password"
               onkeydown="if(event.key==='Enter') emailLogin()"/>
        <button class="pw-eye" onclick="togglePw('password',this)">👁</button>
      </div>
    </div>

    <div class="forgot"><a href="#" onclick="resetPw(event)">Forgot password?</a></div>

    <button class="btn btn-primary submit-btn" onclick="emailLogin()">Sign In →</button>

    <div class="auth-switch">
      Don't have an account? <a href="signup.html">Sign Up Free</a>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signInWithPopup,
    GoogleAuthProvider, sendPasswordResetEmail, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // 🔧 REPLACE WITH YOUR FIREBASE CONFIG
  const firebaseConfig = {
     apiKey: "AIzaSyDftNbRLydAWxC6p0xLmu2lhT3izgGvvns",
  authDomain: "parah-integrated-farm-s.firebaseapp.com",
  projectId: "parah-integrated-farm-s",
  storageBucket: "parah-integrated-farm-s.firebasestorage.app",
  messagingSenderId: "529379479635",
  appId: "1:529379479635:web:5234731e663c529e3676a6"
  };

  const app      = initializeApp(firebaseConfig);
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();

  onAuthStateChanged(auth, user => {
    if (user) window.location.href = 'profile.html';
  });

  window.emailLogin = async function() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    if (!email || !pass) { showErr('Please enter your email and password.'); return; }
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) { showErr(niceError(e.code)); }
  };

  window.googleLogin = async function() {
    try {
      await signInWithPopup(auth, provider);
    } catch(e) { showErr(niceError(e.code)); }
  };

  window.resetPw = async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) { showErr('Enter your email address above first.'); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      showOk('✅ Password reset email sent! Check your inbox.');
    } catch(e) { showErr(niceError(e.code)); }
  };

  function showErr(msg) {
    document.getElementById('errBox').textContent = msg;
    document.getElementById('errBox').style.display = 'block';
    document.getElementById('okBox').style.display  = 'none';
  }
  function showOk(msg) {
    document.getElementById('okBox').textContent = msg;
    document.getElementById('okBox').style.display  = 'block';
    document.getElementById('errBox').style.display = 'none';
  }
  function niceError(code) {
    return {
      'auth/user-not-found':      'No account found with this email.',
      'auth/wrong-password':      'Incorrect password. Try again.',
      'auth/invalid-email':       'Please enter a valid email address.',
      'auth/too-many-requests':   'Too many attempts. Please try again later.',
      'auth/invalid-credential':  'Invalid email or password.',
      'auth/popup-closed-by-user':'Google sign-in was cancelled.',
    }[code] || 'Something went wrong. Please try again.';
  }
</script>
<script>
  function togglePw(id, btn) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
    btn.textContent = el.type === 'password' ? '👁' : '🙈';
  }
</script>
</body>
</html>
